spring:
  profiles:
    # 다른 프로파일을 지정하지 않으면 "local" 이 기본으로 켜진다.
    # → Spring Boot가 프로젝트 루트의 application-local.yml 을 자동으로 읽어 아래 값을 덮어쓴다.
    # 그 파일은 .gitignore 에 있어 커밋되지 않고, 없어도 에러 없이 그냥 기본값(빈 값)으로 실행된다.
    # 템플릿: application-local.yml.example 을 복사해서 만든다.
    # 나중에 배포 환경에서는 SPRING_PROFILES_ACTIVE 를 지정하면 이 기본값은 무시된다.
    default: local
  # 로컬 개발용 MySQL. root/무비밀번호/localhost 라 시크릿이 아니라 여기 커밋해도 된다.
  # 배포 환경에서는 application-local.yml 로 덮어쓴다.
  datasource:
    url: jdbc:mysql://localhost:3306/quantlog?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  task:
    scheduling:
      # 기본은 스레드 1개를 모든 @Scheduled 가 나눠 써서, 느린 KIS 호출 하나가 진입·청산·마틴게일까지 막는다
      # (2026-10-08: 체결 재확인 배치가 10분간 진입을 막아 주기 재매수가 늦음). 같은 작업은 이전 회차가 끝나야 다시 돈다.
      pool:
        size: 4
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false   # 켜면 매초 도는 스케줄러 쿼리로 서버 로그가 가득 찬다. SQL 이 필요할 때만 잠깐 켠다

server:
  port: 8080

# 시크릿은 절대 이 파일(git에 커밋됨)에 적지 않는다. application-local.yml 에만 적는다.
kis:
  mock:
    app-key: ${KIS_MOCK_APP_KEY:}
    app-secret: ${KIS_MOCK_APP_SECRET:}
    account: ${KIS_MOCK_ACCOUNT:}
    log-raw: ${KIS_MOCK_LOG_RAW:false}
    # 실시간 체결통보 구독용 HTS ID(시크릿 취급). 비우면 체결통보를 구독하지 않는다.
    hts-id: ${KIS_MOCK_HTS_ID:}
    # 실시간 시세 WebSocket. 경로는 첫 연결 로그로 확인 필요(2026-09-29: 아직 실측 전).
    # 구독 종목은 DB 의 보유 종목(account_holding)에서 자동으로 정한다 — realtime-max-subscriptions 는 동시 구독 상한.

quantlog:
  broker:
    # kis-mock: 주문도 KIS 모의투자로 낸다 (기본값. 2026-10-02 모킹 체결이 실제 체결가와 달라 다시 되돌림).
    # paper: 시세·분봉만 KIS 에서 받고 주문은 로컬에서 모킹 체결한다 (broker/paper/PaperBroker). 초기 자금·제세금은 PaperProperties 기본값 — 여기서 덮어쓴다.
    type: ${QUANTLOG_BROKER_TYPE:kis-mock}
  notify:
    # Discord/Slack Incoming Webhook URL (시크릿 — application-local.yml 에만 적는다). 비우면 알림 꺼짐.
    webhook-url: ${QUANTLOG_NOTIFY_WEBHOOK_URL:}
  playbook:
    dir: playbook   # 원칙·일지·제안 (playbook/README.md)
  strategy:
    # 초기값(종목 설정 행의 기본값, 백테스트 기본값). 종목별 실제 값은 DB symbol_strategy 가 갖는다. 이후 학습 루프(기획서 6.4)가 결과를 보고 조정한다.
    take-profit-percent: 0.5
    # 손절 보류 (2026-09-30, 사용자 결정). 키를 비워두면 손절 매도를 내지 않는다. 다시 켜려면 아래 줄을 살린다.
    # stop-loss-percent: 1
    martingale:
      # 아래 값은 symbol_strategy 테이블에 종목 행을 새로 만들 때 쓰는 기본값이다. 실제 운영 값은 DB에서 종목별로 바꾼다(README "종목별 매매 설정").
      # 평단 대비 이만큼(%) 떨어질 때마다 보유 수량이 배수가 되도록 추가 매수(2 = 보유 2배).
      drop-percent: 0.5
      multiplier: 2
      max-stages: 10
    entry:
      # 분봉 체류시간 기반 지지선 근접+반등 진입 신호. 검증 전 가설값 (playbook/principles.md "아직 정하는 중").
      min-candles: 15
      near-support-percent: 0.3
      support-bucket-count: 20
      support-zone-fraction: 0.5
  smoke:
    mode: ${QUANTLOG_SMOKE_MODE:}
    market: ${QUANTLOG_SMOKE_MARKET:KR}
    symbol: ${QUANTLOG_SMOKE_SYMBOL:005930}
    quantity: ${QUANTLOG_SMOKE_QUANTITY:1}
  exit:
    # 청산 감시: 정규장 동안 보유 현황(DB)을 보고 익절/손절 목표가에 닿으면 전량 매도한다.
    # 실시간(WebSocket)이 커버하는 종목은 틱마다 바로 판정하고, interval-millis 폴링은 나머지(실시간 끊김 등)만 맡는다.
    # 2026-09-29: REST 잔고 조회 대신 DB 기반으로 바꿔서 초당 요청 한도 걱정 없이 1초로 좁힘.
    enabled: ${QUANTLOG_EXIT_ENABLED:true}
    interval-millis: 1000
  entry:
    # 진입 스케줄러: 국내 정규장 동안 감시 종목(DB symbol_strategy) 분봉을 보고
    # 저점 근접+반등 신호가 뜨면 소량 매수한다. 감시 종목 목록·자동매매 대상 여부는
    # 감시 종목·실제 매수 대상·종목별 값은 모두 DB symbol_strategy 에서 관리한다(여기 yaml이 아님).
    # 검증 전 규칙(playbook/principles.md "아직 정하는 중") — 끄려면 false로.
    enabled: ${QUANTLOG_ENTRY_ENABLED:true}
    interval-millis: 1000
    cooldown: 10m
  reconcile:
    # 주문 직후 한 번에 못 구한 실제 체결가를 1분마다 KIS 에 다시 물어봐서 채운다.
    enabled: ${QUANTLOG_RECONCILE_ENABLED:true}
    interval-millis: 60000
  holding-sync:
    # 증권사 앱에서 직접 거래한 물량을 10초마다 KIS 잔고 기준으로 DB에 맞춘다(화면용 현재가도 같이 갱신) (마틴게일이 DB 기준이라 필요).
    enabled: ${QUANTLOG_HOLDING_SYNC_ENABLED:true}
    interval-millis: 10000
  risk:
    # 1회 주문 상한은 폐지 (2026-09-30). 시장별 자본 배분(국내 1000만원)·하루 손실 -3%가 한도를 맡는다.
    market-allocation-krw: 10000000
