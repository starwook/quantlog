<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 공통 상단 메뉴. 사용: <nav th:replace="~{fragments/nav :: menu('account')}"></nav> (active: account|chart|backtest|settings) -->
<nav th:fragment="menu(active)" class="menu">
    <style>
        .menu { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border, #eceef1); overflow-x: auto; }
        .menu a { padding: 10px 14px; font-size: 14px; font-weight: 600; color: var(--muted, #8b95a1); text-decoration: none; white-space: nowrap; }
        .menu a.active { color: var(--text, #191f28); border-bottom: 2px solid var(--text, #191f28); }
    </style>
    <a href="/" th:classappend="${active == 'account'} ? 'active'">계좌</a>
    <a href="/orders" th:classappend="${active == 'orders'} ? 'active'">주문</a>
    <a href="/chart/KR/005930" th:classappend="${active == 'chart'} ? 'active'">관심종목</a>
    <a href="/backtest/KR/005930" th:classappend="${active == 'backtest'} ? 'active'">백테스트</a>
    <a href="/settings" th:classappend="${active == 'settings'} ? 'active'">설정</a>
</nav>
</body>
</html>
