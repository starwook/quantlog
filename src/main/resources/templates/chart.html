<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${symbolName} + ' 관심종목 · quantlog'"></title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg: #f2f3f5;
            --card: #ffffff;
            --border: #eceef1;
            --text: #191f28;
            --muted: #8b95a1;
            --pos: #f04452;
            --neg: #3182f6;
            --buy: #00c853;
            --sell: #f04452;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 24px 16px 24px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
        }
        main {
            flex: 1;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
        }
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
        }
        /* 종목이 40개여도 한 줄: [이전] [종목 선택] [다음]. 키보드 ←/→ 로도 넘긴다. */
        .symbols { display: flex; gap: 8px; width: 100%; }
        .symbols select {
            flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
            background: var(--card); color: var(--text); font-size: 15px; font-weight: 600;
        }
        .symbols a {
            padding: 10px 14px; border-radius: 10px; background: var(--card);
            font-size: 15px; font-weight: 700; color: var(--text); text-decoration: none;
        }
        .symbols a.disabled { opacity: .3; pointer-events: none; }
        .pos { font-size: 12px; color: var(--muted); align-self: center; white-space: nowrap; }
        h1 {
            font-size: 18px;
            margin: 0 0 4px;
            font-weight: 700;
        }
        .price { font-size: 28px; font-weight: 700; margin: 0 0 2px; }
        .price small { font-size: 14px; font-weight: 500; margin-left: 8px; }
        .price.up { color: var(--pos); }
        .price.down { color: var(--neg); }
        .order .info { flex-basis: 100%; font-size: 14px; }
        .order .info .up { color: var(--pos); }
        .order .info .down { color: var(--neg); }
        .status {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 12px;
        }
        .status.error { color: var(--pos); }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
        }
        #chart {
            width: 100%;
            height: 420px;
        }
        .empty {
            padding: 64px 16px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }
        .legend {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
        }
        .legend .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .legend .buy .dot { background: var(--buy); }
        .legend .sell .dot { background: var(--sell); }
        .banner { padding: 12px 16px; border-radius: 12px; margin-bottom: 12px; font-size: 14px; background: var(--card); }
        .banner.ok { border-left: 4px solid var(--neg); }
        .banner.error { border-left: 4px solid var(--pos); color: var(--pos); }
        .order { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
        .order input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; }
        .order .muted { color: var(--muted); font-size: 14px; }
        .order button { padding: 10px 20px; border: 0; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
        .order .cancel-btn { padding: 2px 10px; background: var(--muted); font-size: 13px; }
        .buy-btn { background: var(--pos); }
        .sell-btn { background: var(--neg); }
        footer {
            margin-top: 16px;
            padding: 0 4px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
<main>
    <nav th:replace="~{fragments/nav :: menu('chart')}"></nav>
    <div class="nav">
        <div class="symbols" id="symbols">
            <a href="#" id="prev" title="이전 종목 (←)">‹</a>
            <select id="symbolSelect" aria-label="종목 선택">
                <option th:each="s : ${watchedSymbols}"
                        th:value="@{'/chart/' + ${s.market} + '/' + ${s.symbol}}"
                        th:text="${s.displayName} + ' (' + ${s.market} + ' ' + ${s.symbol} + ')'"
                        th:selected="${s.symbol == symbol and s.market == market}"></option>
            </select>
            <a href="#" id="next" title="다음 종목 (→)">›</a>
            <span class="pos" id="pos"></span>
        </div>
    </div>
    </div>

    <div class="nav" style="margin-top: -4px;">
        <span></span>
        <a th:href="@{'/backtest/' + ${market} + '/' + ${symbol}}">백테스트 보기 →</a>
    </div>

    <div class="banner ok" th:if="${message}" th:text="${message}"></div>
    <div class="banner error" th:if="${error}" th:text="${error}"></div>

    <h1 th:text="${symbolName} + ' · ' + ${market} + ' 당일 분봉'"></h1>
    <div class="price" id="price">-</div>
    <div class="status" id="status">불러오는 중…</div>

    <div class="card">
        <div id="chart"></div>
        <div id="empty" class="empty" style="display:none;"></div>
        <div class="legend">
            <span class="buy"><span class="dot"></span>매수</span>
            <span class="sell"><span class="dot"></span>매도</span>
        </div>
    </div>

    <form class="card order" method="post" th:action="@{'/chart/' + ${market} + '/' + ${symbol} + '/order'}"
          onsubmit="return event.submitter.dataset.cancel ? confirm('이 주문을 취소할까요?') : confirm(event.submitter.dataset.label + ' ' + this.quantity.value + '주 ' + (this.price.value ? '@ ' + this.price.value + ' 지정가로 ' : '즉시 체결가로 ') + '주문할까요?')">
        <div class="info" id="holding"></div>
        <div class="info muted" id="orderTotal"></div>
        <div class="info" id="pending"></div>
        <input type="number" name="price" min="0" step="any" placeholder="가격 (비우면 즉시 체결)" aria-label="지정가">
        <input type="number" name="quantity" min="1" value="1" required aria-label="수량">
        <span class="muted">주</span>
        <button type="submit" name="side" value="BUY" data-label="매수" class="buy-btn">매수</button>
        <button type="submit" name="side" value="SELL" data-label="매도" class="sell-btn">매도</button>
    </form>

    <footer>모의투자 실험 기록입니다. 가격을 비우면 현재가보다 한 호가 불리한 지정가로 즉시 체결되고, 가격을 입력하면 그 지정가로 주문해 체결되지 않을 수 있습니다(호가 단위에 맞아야 함). 투자 권유가 아닙니다. 국내 종목은 실시간, 그 외에는 20초마다 갱신됩니다.</footer>
</main>
<script th:inline="javascript">
    const market = /*[[${market}]]*/ 'KR';
    const symbol = /*[[${symbol}]]*/ '';
    const dataUrl = '/chart/' + market + '/' + symbol + '/data';

    const sel = document.getElementById('symbolSelect');
    const go = (i) => { if (i >= 0 && i < sel.options.length) location.href = sel.options[i].value; };
    sel.addEventListener('change', () => { location.href = sel.value; });
    document.getElementById('prev').addEventListener('click', (e) => { e.preventDefault(); go(sel.selectedIndex - 1); });
    document.getElementById('next').addEventListener('click', (e) => { e.preventDefault(); go(sel.selectedIndex + 1); });
    document.getElementById('prev').classList.toggle('disabled', sel.selectedIndex <= 0);
    document.getElementById('next').classList.toggle('disabled', sel.selectedIndex >= sel.options.length - 1);
    document.getElementById('pos').textContent = (sel.selectedIndex + 1) + '/' + sel.options.length;
    document.addEventListener('keydown', (e) => {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
        if (e.key === 'ArrowLeft') go(sel.selectedIndex - 1);
        if (e.key === 'ArrowRight') go(sel.selectedIndex + 1);
    });

    const chartEl = document.getElementById('chart');
    const statusEl = document.getElementById('status');
    const emptyEl = document.getElementById('empty');

    const chart = LightweightCharts.createChart(chartEl, {
        layout: { background: { color: '#ffffff' }, textColor: '#191f28' },
        grid: { vertLines: { color: '#eceef1' }, horzLines: { color: '#eceef1' } },
        timeScale: { timeVisible: true, secondsVisible: false },
        rightPriceScale: { borderVisible: false },
    });
    const candleSeries = chart.addCandlestickSeries({
        upColor: '#f04452', downColor: '#3182f6', borderVisible: false,
        wickUpColor: '#f04452', wickDownColor: '#3182f6',
    });
    const volumeSeries = chart.addHistogramSeries({
        priceFormat: { type: 'volume' },
        priceScaleId: '',
    });
    volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

    new ResizeObserver(() => chart.applyOptions({ width: chartEl.clientWidth })).observe(chartEl);

    function formatPrice(value) {
        // 원화는 소수점 없이, 그 외(달러 등)는 소수점 둘째 자리까지 — 천 단위 구분자 포함.
        const decimals = market === 'KR' ? 0 : 2;
        return Number(value).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    function markerFor(trade) {
        const isBuy = trade.side === 'BUY';
        return {
            time: trade.time,
            position: isBuy ? 'belowBar' : 'aboveBar',
            color: isBuy ? '#00c853' : '#f04452',
            shape: isBuy ? 'arrowUp' : 'arrowDown',
            text: (isBuy ? '매수 ' : '매도 ') + trade.quantity + '주 @ ' + formatPrice(trade.price) + (trade.status === 'OPEN' ? ' (미체결)' : trade.status === 'UNCONFIRMED' ? ' (체결 확인중)' : ''),
        };
    }

    // 현재가 = 최신 분봉 종가, 등락 = 전일 종가 대비(전일 종가를 못 받으면 당일 첫 분봉 시가 대비로 대신한다).
    const priceEl = document.getElementById('price');
    let baseline = null;
    let baselineLabel = '';
    // 보유 정보는 REST 응답으로 받고, 평가손익은 최신 가격으로 다시 계산한다.
    const holdingEl = document.getElementById('holding');
    let holding = null;
    let lastPrice = null;
    // 포트폴리오 스트림(/ws/portfolio)이 보내는 보유 종목. 연결되면 REST 의 holding 대신 이걸 쓴다 — 두 화면의 평단·평가손익이 같은 값이 된다.
    let liveHolding;
    function showHolding() {
        if (liveHolding !== undefined) {
            if (liveHolding === null) {
                holdingEl.textContent = '보유 없음';
                return;
            }
            const css = liveHolding.unrealizedCss === 'pos' ? 'up' : liveHolding.unrealizedCss === 'neg' ? 'down' : '';
            holdingEl.innerHTML = '보유 ' + liveHolding.quantity + '주 · 평단 ' + liveHolding.avgCostText
                + ' · 평가금액 ' + liveHolding.valueText
                + ' · <span class="' + css + '">평가손익 ' + liveHolding.unrealizedText + '</span>';
            return;
        }
        if (!holding || holding.quantity <= 0) {
            holdingEl.textContent = '보유 없음';
            return;
        }
        if (lastPrice === null) return;
        const profit = (lastPrice - holding.avgCost) * holding.quantity;
        const pct = ((lastPrice - holding.avgCost) / holding.avgCost * 100).toFixed(2);
        const sign = profit > 0 ? '+' : '';
        holdingEl.innerHTML = '보유 ' + holding.quantity + '주 · 평단 ' + formatPrice(holding.avgCost)
            + ' · 평가금액 ' + formatPrice(lastPrice * holding.quantity)
            + ' · <span class="' + (profit > 0 ? 'up' : profit < 0 ? 'down' : '') + '">평가손익 '
            + sign + formatPrice(profit) + ' (' + sign + pct + '%)</span>';
    }

    // 주문 총액 = 입력 수량 × 현재가. 수량을 바꾸거나 가격이 움직일 때마다 다시 계산한다.
    const quantityEl = document.querySelector('form.order input[name=quantity]');
    const priceInputEl = document.querySelector('form.order input[name=price]');
    const orderTotalEl = document.getElementById('orderTotal');
    function showOrderTotal() {
        const quantity = parseInt(quantityEl.value, 10);
        const price = parseFloat(priceInputEl.value) || lastPrice;
        orderTotalEl.textContent = price !== null && quantity > 0 ? '주문 총액 ' + formatPrice(price * quantity) : '';
    }
    quantityEl.addEventListener('input', showOrderTotal);
    priceInputEl.addEventListener('input', showOrderTotal);

    // 증권사가 미체결로 확인한 주문(취소 가능)과, 체결조회에 아직 안 잡혀 상태를 모르는 주문(체결 확인중)을 주문 폼 위에 보여준다.
    const pendingEl = document.getElementById('pending');
    function showPending(trades) {
        const orderText = (t) => '<span class="' + (t.side === 'BUY' ? 'down' : 'up') + '">' + (t.side === 'BUY' ? '매수 ' : '매도 ')
            + t.quantity + '주 @ ' + formatPrice(t.price) + '</span>';
        const open = trades.filter(t => t.status === 'OPEN').map(t => '미체결 ' + orderText(t)
            + ' <button type="submit" formaction="/chart/' + market + '/' + symbol + '/cancel" formnovalidate name="tradeId" value="'
            + t.id + '" data-cancel="true" class="cancel-btn">취소</button>');
        const unconfirmed = trades.filter(t => t.status === 'UNCONFIRMED').map(t => '체결 확인중 ' + orderText(t));
        pendingEl.innerHTML = open.concat(unconfirmed).join('<br>');
    }

    function showPrice(price) {
        lastPrice = price;
        showHolding();
        showOrderTotal();
        if (baseline === null) return;
        const diff = price - baseline;
        const pct = (diff / baseline * 100).toFixed(2);
        const sign = diff > 0 ? '+' : '';
        priceEl.className = 'price ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : '');
        priceEl.innerHTML = formatPrice(price) + '<small>' + baselineLabel + ' ' + sign + pct + '%</small>';
    }

    async function refresh() {
        try {
            const res = await fetch(dataUrl);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const body = await res.json();

            if (body.candles.length === 0) {
                chartEl.style.display = 'none';
                emptyEl.style.display = 'block';
                emptyEl.textContent = '아직 오늘 분봉 데이터가 없습니다. 장이 열리고 진입 스케줄러가 한 번 돌면 쌓입니다.';
                statusEl.textContent = '대기 중 · ' + new Date().toLocaleTimeString('ko-KR');
                statusEl.classList.remove('error');
                return;
            }
            chartEl.style.display = 'block';
            emptyEl.style.display = 'none';

            holding = body.holding;
            baseline = body.previousClose || body.candles[0].open;
            baselineLabel = body.previousClose ? '전일 대비' : '시가 대비';
            showPrice(body.candles[body.candles.length - 1].close);
            candleSeries.setData(body.candles);
            volumeSeries.setData(body.candles.map(c => ({
                time: c.time,
                value: c.volume,
                color: c.close >= c.open ? 'rgba(240,68,82,0.5)' : 'rgba(49,130,246,0.5)',
            })));
            candleSeries.setMarkers(body.trades.map(markerFor));
            showPending(body.trades);
            chart.timeScale().fitContent();

            statusEl.textContent = '마지막 갱신 ' + new Date().toLocaleTimeString('ko-KR');
            statusEl.classList.remove('error');
        } catch (e) {
            statusEl.textContent = '데이터를 불러오지 못했습니다 — 잠시 후 다시 시도합니다.';
            statusEl.classList.add('error');
        }
    }

    // REST: 페이지 열릴 때 그날 전체 히스토리를 한 번 채운다. 이후엔 매매 마커만 가볍게 재확인.
    refresh();
    setInterval(refresh, 20000);

    // WebSocket: 실시간 분봉은 여기서만 받는다(KisRealtimeClient → ChartBroadcaster). 꺼져 있으면(연결 실패)
    // REST 20초 폴링만으로도 계속 동작한다 — 실시간은 있으면 좋은 보강이지 필수 경로가 아니다.
    function connectLive() {
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(proto + location.host + '/ws/chart');
        ws.onopen = () => ws.send('SUBSCRIBE ' + market + ' ' + symbol);
        ws.onmessage = (event) => {
            const candle = JSON.parse(event.data);
            if (chartEl.style.display === 'none') {
                chartEl.style.display = 'block';
                emptyEl.style.display = 'none';
            }
            showPrice(candle.close);
            candleSeries.update(candle);
            volumeSeries.update({
                time: candle.time,
                value: candle.volume,
                color: candle.close >= candle.open ? 'rgba(240,68,82,0.5)' : 'rgba(49,130,246,0.5)',
            });
            statusEl.textContent = '실시간 · ' + new Date().toLocaleTimeString('ko-KR');
            statusEl.classList.remove('error');
        };
        ws.onclose = () => setTimeout(connectLive, 5000);
        ws.onerror = () => ws.close();
    }
    connectLive();

    // WebSocket(/ws/portfolio): 보유 수량·평단·평가손익은 주문 화면과 같은 포트폴리오 스트림으로 받는다(체결 즉시 반영).
    function connectHolding() {
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(proto + location.host + '/ws/portfolio');
        const mine = (h) => h.market === market && h.symbol === symbol;
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'snapshot' || msg.type === 'holdings') {
                liveHolding = msg.holdings.find(mine) || null;
            } else if (msg.type === 'price' && mine(msg.holding)) {
                liveHolding = msg.holding;
            } else {
                return;
            }
            showHolding();
        };
        ws.onclose = () => {
            liveHolding = undefined;
            setTimeout(connectHolding, 3000);
        };
        ws.onerror = () => ws.close();
    }
    connectHolding();
</script>
</body>
</html>
