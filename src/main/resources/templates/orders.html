<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>quantlog · 주문</title>
    <style>
        :root {
            --bg: #f2f3f5;
            --card: #ffffff;
            --border: #eceef1;
            --text: #191f28;
            --muted: #8b95a1;
            --buy: #f04452;
            --sell: #3182f6;
            --ok: #00a862;
            --warn: #f59f00;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px 16px 48px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
        }
        main { max-width: 720px; margin: 0 auto; }
        .title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { font-size: 22px; margin: 0; font-weight: 700; }
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--card); font-size: 14px; font-weight: 600; color: var(--muted); }
        .tab.active { background: var(--text); color: #fff; border-color: var(--text); }
        .tab:disabled { opacity: 0.5; }
        .pos { color: var(--buy); }
        .neg { color: var(--sell); }
        .zero, .muted { color: var(--muted); }
        .conn { font-size: 13px; color: var(--muted); }
        .conn::before { content: "●"; margin-right: 4px; color: var(--muted); }
        .conn.on::before { color: var(--ok); }
        .card { background: var(--card); border-radius: 16px; padding: 8px 20px; margin-bottom: 16px; }
        h2 { font-size: 15px; margin: 0; padding: 12px 0 4px; color: var(--muted); font-weight: 600; }
        .summary { padding: 16px 20px; }
        .summary .label { font-size: 13px; color: var(--muted); }
        .summary .big { font-size: 26px; font-weight: 800; margin: 2px 0 12px; }
        .top { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
        .stat .v { font-size: 15px; font-weight: 700; margin-top: 2px; }
        .order { padding: 12px 8px; margin: 0 -8px; border-top: 1px solid var(--border); font-size: 15px; border-radius: 10px; }
        .order:first-child { border-top: none; }
        .order.flash { animation: flash 3s ease-out; }
        .order.flash::before { content: "NEW"; float: right; font-size: 10px; font-weight: 800; color: #fff; background: var(--warn); border-radius: 4px; padding: 1px 5px; margin-left: 6px; animation: fade 3s ease-out forwards; }
        @keyframes flash {
            0% { background: #ffe58a; transform: translateX(12px); opacity: 0.3; }
            15% { transform: none; opacity: 1; }
            100% { background: transparent; }
        }
        @keyframes fade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
        .summary.flash { animation: flash 3s ease-out; }
        .line { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .line + .line { margin-top: 4px; }
        .name { font-weight: 700; color: inherit; text-decoration: none; }
        a.name:hover { text-decoration: underline; }
        .name.pos { color: var(--buy); }
        .name.neg { color: var(--sell); }
        .code, .sub { font-size: 12px; color: var(--muted); margin-left: 4px; font-weight: 400; }
        .side { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; color: #fff; margin-right: 6px; }
        .side.BUY { background: var(--buy); }
        .side.SELL { background: var(--sell); }
        .badge { font-size: 12px; font-weight: 700; }
        .badge.CHECKING, .badge.OPEN { color: var(--warn); }
        .badge.FILLED { color: var(--ok); }
        .reason { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
        .pnl { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--bg); }
        .pnl .amount { font-size: 16px; font-weight: 800; }
        .pnl .detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .empty { padding: 20px 0; text-align: center; font-size: 14px; color: var(--muted); }
    </style>
</head>
<body>
<main>
    <nav th:replace="~{fragments/nav :: menu('orders')}"></nav>
    <section class="card summary" id="summary" hidden>
        <div class="top">
            <div><div class="label">오늘 실현손익 <span class="sub">(매도 확정분)</span></div><div class="big" id="sumToday"></div></div>
            <div><div class="label">현재 평가손익</div><div class="big" id="sumUnrealized"></div></div>
        </div>
        <div class="label">총 평가금액 <span class="sub">(보유 종목 합계)</span></div>
        <div class="big" id="sumTotalValue"></div>
        <div class="stats">
            <div class="stat"><div class="label">승률 (승 / 패)</div><div class="v" id="sumWinRate"></div></div>
            <div class="stat"><div class="label">매수 회수</div><div class="v" id="sumBuy"></div></div>
            <div class="stat"><div class="label">매도 회수</div><div class="v" id="sumSell"></div></div>
        </div>
    </section>

    <div class="title">
        <h1>실시간 주문</h1>
        <span id="conn" class="conn">연결 중</span>
    </div>

    <div class="tabs">
        <button class="tab active" data-market="KR">국내</button>
        <button class="tab" disabled title="해외 체결통보 실측 후 지원">해외 (준비중)</button>
    </div>

    <section class="card">
        <h2>보유 종목 (<span id="holdCount">0</span>)</h2>
        <div id="holdings"></div>
    </section>

    <section class="card">
        <h2>대기열 — 미체결 (<span id="waitCount">0</span>)</h2>
        <div id="waiting"></div>
    </section>

    <section class="card">
        <h2>체결 내역</h2>
        <div id="done"></div>
    </section>
</main>

<script>
    // 서버가 접속 직후 보유 종목·대기열·체결 내역 전체(snapshot)를 보내고, 이후 주문 한 건(order), 보유 종목 목록(holdings), 보유 종목 틱(price)을 보낸다.
    // 포맷·색상 판정은 서버가 끝내서 보내므로 여기서는 찍기만 한다.
    const market = 'KR'; // 해외는 체결통보 실측 후 탭을 연다
    const orders = new Map(); // key -> 주문
    let holdings = [];
    const STATE_TEXT = { CHECKING: '체결 확인중', OPEN: '미체결', FILLED: '체결' };
    const isWaiting = (o) => o.state === 'CHECKING' || o.state === 'OPEN';

    function el(tag, className, text) {
        const e = document.createElement(tag);
        if (className) e.className = className;
        if (text !== undefined) e.textContent = text;
        return e;
    }

    function line(...children) {
        const l = el('div', 'line');
        children.forEach((c) => l.appendChild(c));
        return l;
    }

    // 종목명은 관심종목 화면(차트)으로 가는 링크다.
    function symbolLink(market, symbol, name) {
        const a = el('a', 'name', name);
        a.href = '/chart/' + market + '/' + symbol;
        return a;
    }

    function sideAndName(side, market, name, code) {
        const left = el('span');
        left.appendChild(el('span', 'side ' + side, side === 'BUY' ? '매수' : '매도'));
        left.appendChild(symbolLink(market, code, name));
        left.appendChild(el('span', 'code', code));
        return left;
    }

    function renderHolding(h) {
        const row = el('div', 'order');
        const left = el('span');
        left.appendChild(symbolLink(h.market, h.symbol, h.symbolName));
        left.appendChild(el('span', 'code', h.symbol));
        row.appendChild(line(left, el('span', 'name ' + h.unrealizedCss, h.unrealizedText)));
        row.appendChild(el('div', 'sub', h.quantity + '주 · 평단 ' + h.avgCostText + ' → 현재 ' + h.currentPriceText));
        row.appendChild(el('div', 'sub', '평가금액 ' + h.valueText));
        return row;
    }

    function renderOrder(o, flashKey) {
        const row = el('div', 'order' + (o.key === flashKey ? ' flash' : ''));
        const badge = el('span', 'badge ' + o.state, STATE_TEXT[o.state]);
        badge.dataset.waitingSince = isWaiting(o) ? o.placedAtEpochMs : '';
        row.appendChild(line(sideAndName(o.side, o.market, o.symbolName, o.symbol), badge));

        const price = o.filledPriceText ? o.filledPriceText + ' (지정가 ' + o.orderPriceText + ')' : o.orderPriceText + ' (지정가)';
        row.appendChild(line(el('span', '', o.quantity + '주 @ ' + price), el('span', 'sub', o.timeText)));
        if (o.pnlText) {
            const box = el('div', 'pnl');
            box.appendChild(el('div', 'amount ' + o.pnlCss, '실현손익 ' + o.pnlText));
            box.appendChild(el('div', 'detail', o.pnlDetailText));
            row.appendChild(box);
        }
        if (o.reason) row.appendChild(el('div', 'reason', o.reason));
        return row;
    }

    function renderSummary(sm, flash) {
        const box = document.getElementById('summary');
        if (!sm) return;
        box.hidden = false;
        const set = (id, text, css) => { const e = document.getElementById(id); e.textContent = text; if (css !== undefined) e.className = e.className.replace(/\b(pos|neg|zero)\b/g, '').trim() + ' ' + css; };
        set('sumToday', sm.todayText, sm.todayCss);
        set('sumUnrealized', sm.unrealizedText, sm.unrealizedCss);
        set('sumTotalValue', sm.totalValueText);
        set('sumWinRate', sm.winRateText + ' (' + sm.win + '승 ' + sm.loss + '패)');
        set('sumBuy', sm.buyCount + '회');
        set('sumSell', sm.sellCount + '회');
        if (flash) { box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash'); }
    }

    function renderList(container, list, renderRow, emptyText) {
        container.replaceChildren();
        if (list.length === 0) container.appendChild(el('div', 'empty', emptyText));
        list.forEach((x) => container.appendChild(renderRow(x)));
    }

    // 틱마다 불리므로 보유 종목 목록만 다시 그린다.
    function renderHoldings() {
        const myHoldings = holdings.filter((h) => h.market === market);
        document.getElementById('holdCount').textContent = myHoldings.length;
        renderList(document.getElementById('holdings'), myHoldings, renderHolding, '보유 종목이 없습니다.');
    }

    function render(flashKey) {
        const mine = [...orders.values()].filter((o) => o.market === market).sort((a, b) => b.placedAtEpochMs - a.placedAtEpochMs);
        const waiting = mine.filter(isWaiting);
        document.getElementById('waitCount').textContent = waiting.length;
        renderHoldings();
        renderList(document.getElementById('waiting'), waiting, (o) => renderOrder(o, flashKey), '대기 중인 주문이 없습니다.');
        renderList(document.getElementById('done'), mine.filter((o) => o.state === 'FILLED'), (o) => renderOrder(o, flashKey), '체결된 주문이 없습니다.');
        tick();
    }

    // 대기열 항목에 경과 초를 매초 갱신해서 붙인다.
    function tick() {
        document.querySelectorAll('#waiting .badge').forEach((b) => {
            const since = Number(b.dataset.waitingSince);
            if (!since) return;
            const sec = Math.max(0, Math.floor((Date.now() - since) / 1000));
            b.textContent = (b.classList.contains('OPEN') ? '미체결' : '체결 확인중') + ' · ' + sec + '초';
        });
    }
    setInterval(tick, 1000);

    function connect() {
        const conn = document.getElementById('conn');
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(proto + location.host + '/ws/orders');
        ws.onopen = () => { conn.textContent = '실시간 연결됨'; conn.className = 'conn on'; };
        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === 'snapshot') {
                orders.clear();
                msg.orders.forEach((o) => orders.set(o.key, o));
                holdings = msg.holdings;
                renderSummary(msg.summary, false);
                render();
            } else if (msg.type === 'order') {
                // 취소된 주문은 대기열에서 사라질 뿐 내역에 남기지 않는다.
                if (msg.order.state === 'CANCELED') orders.delete(msg.order.key); else orders.set(msg.order.key, msg.order);
                renderSummary(msg.summary, true);
                render(msg.order.key);
            } else if (msg.type === 'price') {
                // 보유 종목 한 건의 실시간 틱: 그 종목 행과 요약 카드의 평가손익만 바꾼다.
                holdings = holdings.map((h) => (h.market === msg.holding.market && h.symbol === msg.holding.symbol ? msg.holding : h));
                renderHoldings();
                document.getElementById('sumTotalValue').textContent = msg.totalValueText;
                const sum = document.getElementById('sumUnrealized');
                sum.textContent = msg.unrealizedText;
                sum.className = sum.className.replace(/\b(pos|neg|zero)\b/g, '').trim() + ' ' + msg.unrealizedCss;
            } else if (msg.type === 'holdings') {
                holdings = msg.holdings;
                renderSummary(msg.summary, false);
                render();
            }
        };
        // 끊기면 3초 뒤 다시 붙는다. 다시 붙을 때 snapshot 을 새로 받으므로 놓친 변화도 채워진다.
        ws.onclose = () => { conn.textContent = '연결 끊김 — 재연결 중'; conn.className = 'conn'; setTimeout(connect, 3000); };
    }
    render();
    connect();
</script>
</body>
</html>
