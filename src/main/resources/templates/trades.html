<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>quantlog · 계좌</title>
    <style>
        :root {
            --bg: #f2f3f5;
            --card: #ffffff;
            --border: #eceef1;
            --text: #191f28;
            --muted: #8b95a1;
            /* 한국 증권가 관행: 이익(상승)=빨강, 손실(하락)=파랑 */
            --pos: #f04452;
            --neg: #3182f6;
            --buy-bg: #eef2ff;
            --buy-text: #4f5b76;
            --sell-bg: #f4f4f5;
            --sell-text: #4f5b76;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px 16px 48px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
        }
        main {
            max-width: 720px;
            margin: 0 auto;
        }
        h1 {
            font-size: 18px;
            margin: 0 0 16px;
            color: var(--muted);
            font-weight: 600;
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 16px;
        }
        .label {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .headline {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .rows { margin-top: 20px; }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 15px;
            border-top: 1px solid var(--border);
        }
        .row:first-child { border-top: none; }
        .row .k { color: var(--muted); }
        .row .v { font-weight: 600; }
        .pos { color: var(--pos); }
        .neg { color: var(--neg); }
        .zero, .muted { color: var(--muted); }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 4px 4px 10px;
            font-size: 15px;
            font-weight: 700;
        }
        .section-title .count { font-weight: 400; color: var(--muted); font-size: 13px; }

        .holding {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-top: 1px solid var(--border);
        }
        .holding:first-child { border-top: none; }
        .holding .name { font-weight: 600; font-size: 15px; }
        .holding .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
        .holding .right { text-align: right; }
        .holding .value { font-weight: 600; font-size: 15px; }
        .holding .pnl { font-size: 13px; margin-top: 2px; }
        .stale-mark { color: var(--muted); font-size: 11px; }

        .trade {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
        }
        .trade:first-child { border-top: none; }
        .trade .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .trade .who {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.buy { color: var(--buy-text); background: var(--buy-bg); }
        .badge.sell { color: var(--sell-text); background: var(--sell-bg); }
        .trade .symbol { font-weight: 600; font-size: 15px; }
        .trade .right { text-align: right; }
        .trade .value { font-weight: 600; font-size: 15px; }
        .trade .pnl { font-size: 13px; margin-top: 2px; }
        .trade .meta {
            margin-top: 8px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
        }
        .trade .meta .reason { color: var(--text); }

        .empty {
            padding: 48px 16px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }
        footer {
            margin-top: 16px;
            padding: 0 4px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
<main>
    <div th:each="s : ${summaries}" style="margin-bottom: 24px;">
        <h1 th:text="${s.currency} + ' 계좌'"></h1>

        <div class="card">
            <div class="label">평가금액</div>
            <div class="headline" th:text="${s.holdingsValueText} + ' ' + ${s.currency}"></div>

            <div class="rows">
                <div class="row">
                    <span class="k">매입원금</span>
                    <span class="v" th:text="${s.costBasisText} + ' ' + ${s.currency}"></span>
                </div>
                <div class="row">
                    <span class="k">평가손익</span>
                    <span class="v" th:classappend="${s.unrealizedCss}" th:text="${s.unrealizedText}"></span>
                </div>
                <div class="row">
                    <span class="k">오늘 실현손익</span>
                    <span class="v" th:classappend="${s.realizedTodayCss}" th:text="${s.realizedTodayText}"></span>
                </div>
                <div class="row">
                    <span class="k">누적 실현손익</span>
                    <span class="v" th:classappend="${s.realizedTotalCss}" th:text="${s.realizedTotalText}"></span>
                </div>
            </div>
        </div>

        <div class="section-title">
            <span>보유 종목</span>
            <span class="count" th:text="${s.holdingCount} + '개'"></span>
        </div>
        <div class="card" style="padding: 0;">
            <div th:if="${s.holdingCount == 0}" class="empty">보유 중인 종목이 없습니다.</div>
            <div class="holding" th:each="h : ${s.holdings}">
                <div>
                    <div class="name" th:text="${h.symbol} + ' · ' + ${h.market}"></div>
                    <div class="meta" th:text="${h.quantity} + '주 · 평단 ' + ${h.avgCost}"></div>
                </div>
                <div class="right">
                    <div class="value">
                        <span th:text="${h.valueText}"></span>
                        <span class="stale-mark" th:if="${h.stale}">· 갱신 실패</span>
                    </div>
                    <div class="pnl" th:classappend="${h.pnlCss}" th:text="${h.pnlText}"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="empty" th:unless="${hasSummaries}">아직 계좌 데이터가 없습니다.</div>

    <div class="section-title"><span>매매 기록</span></div>
    <div class="card" style="padding: 0;">
        <div class="empty" th:unless="${hasTrades}">아직 기록된 매매가 없습니다.</div>
        <div class="trade" th:each="t : ${trades}">
            <div class="top">
                <div class="who">
                    <span class="badge" th:classappend="${t.sideCss}" th:text="${t.side == 'BUY'} ? '매수' : '매도'"></span>
                    <span class="symbol" th:text="${t.symbol} + ' · ' + ${t.market}"></span>
                </div>
                <div class="right">
                    <div class="value" th:text="${t.quantity} + '주 @ ' + ${t.orderPrice}"></div>
                    <div class="pnl" th:classappend="${t.pnlCss}" th:text="${t.pnlText}"></div>
                </div>
            </div>
            <div class="meta">
                <span th:text="${t.executedAtKst}"></span> · 주문번호 <span th:text="${t.orderNo}"></span><br>
                사유: <span class="reason" th:text="${t.reason}"></span>
            </div>
        </div>
    </div>

    <footer>모의투자 실험 기록입니다. 투자 권유가 아니며, 지정가는 실제 체결가와 다를 수 있습니다.</footer>
</main>
</body>
</html>
