name: deploy

on:
  push:
    branches: [main]
    # 문서만 바뀐 푸시는 배포하지 않는다(jar 도, 서버에 올라가는 파일도 안 바뀐다). 아래 목록이 "서버에 영향 없는 파일"이다.
    # playbook/principles.md 는 배포가 서버로 올리고 PrinciplesAlignmentTest 가 읽으므로 문서여도 배포한다.
    # 문서가 아닌 파일(코드·deploy/·워크플로)이 하나라도 섞여 있으면 평소처럼 배포한다. 수동 실행(workflow_dispatch)은 항상 된다.
    paths:
      - "**"
      - "!docs/**"
      - "!README.md"
      - "!CLAUDE.md"
      - "!playbook/**"
      - "playbook/principles.md"
  workflow_dispatch:
    inputs:
      force_gateway:
        description: "장중에도 게이트웨이를 배포한다 (실시간 연결·체결 기록이 잠깐 끊김)"
        type: boolean
        default: false

# 동시에 두 배포가 돌지 않게 한다 (서버 쪽에도 flock 이 있다)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 테스트가 application.yml 기본값(localhost:3306, root/무비밀번호, DB quantlog)으로 실제 MySQL에 붙는다
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: quantlog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test
        run: ./gradlew ktlintCheck test bootJar
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SKIP_BUILD: "1"
          FORCE_GATEWAY: ${{ inputs.force_gateway && '1' || '' }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          DEPLOY_KEY="$RUNNER_TEMP/deploy_key" deploy/deploy.sh
