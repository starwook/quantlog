name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 동시에 두 배포가 돌지 않게 한다 (서버 쪽에도 flock 이 있다)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test
        run: ./gradlew ktlintCheck test bootJar
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SKIP_BUILD: "1"
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          DEPLOY_KEY="$RUNNER_TEMP/deploy_key" deploy/deploy.sh
