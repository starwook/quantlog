<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 리뷰 화면 3개(review · review-day · review-favorites)가 같이 쓰는 스타일과 제안 카드. -->
<style th:fragment="style">
        :root {
            --bg: #f2f3f5;
            --card: #ffffff;
            --border: #eceef1;
            --text: #191f28;
            --muted: #8b95a1;
            --err: #f04452;
            --ok: #0f9d58;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 24px 16px 24px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
        }
        main { flex: 1; max-width: 720px; width: 100%; margin: 0 auto; }
        h1 { font-size: 18px; margin: 0 0 4px; font-weight: 700; }
        h2 { font-size: 15px; margin: 24px 0 8px; font-weight: 700; }
        .note { font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
        .card { background: var(--card); border-radius: 16px; margin-bottom: 12px; padding: 16px 20px; }
        .run { display: flex; align-items: center; gap: 12px; }
        button {
            padding: 10px 16px; border: none; border-radius: 10px; background: var(--text); color: #fff;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        button:disabled { background: var(--muted); cursor: default; }
        .msg { padding: 12px 16px; border-radius: 12px; margin-bottom: 12px; font-size: 14px; background: var(--card); }
        .msg.done { color: var(--ok); }
        .msg.error { color: var(--err); }
        details > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
        .run { flex-wrap: wrap; }
        input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; width: 160px; }
        .md { margin-top: 12px; font-size: 14px; line-height: 1.7; word-break: break-word; }
        .md h1 { font-size: 16px; margin: 0 0 8px; }
        .md h2 { font-size: 15px; margin: 20px 0 6px; padding-top: 12px; border-top: 1px solid var(--border); }
        .md h3 { font-size: 14px; margin: 14px 0 4px; }
        .md p, .md ul, .md ol { margin: 6px 0; }
        .md ul, .md ol { padding-left: 20px; }
        .md code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
        .md pre { background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
        .md pre code { padding: 0; background: none; }
        .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
        .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; }
        .md .entry + .entry { margin-top: 20px; padding-top: 12px; border-top: 1px dashed var(--border); }
        .md .entry-time { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
        .md .sec { margin: 8px 0; padding: 10px 14px; border-radius: 12px; border-left: 4px solid var(--muted); background: #f7f8fa; }
        .md .sec h3 { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
        .md .sec > :last-child { margin-bottom: 0; }
        .md .sec-sum { background: #eef4ff; border-left-color: #3182f6; }
        .md .sec-sum h3 { color: #3182f6; }
        .md .sec-sum p { font-size: 15px; font-weight: 600; }
        .md .sec-good { background: #edf8f1; border-left-color: var(--ok); }
        .md .sec-good h3 { color: var(--ok); }
        .md .sec-bad { background: #fff0f1; border-left-color: var(--err); }
        .md .sec-bad h3 { color: var(--err); }
        .md .sec-rule { background: #f3f0ff; border-left-color: #7c5cff; }
        .md .sec-rule h3 { color: #7c5cff; }
        .md .sec-data h3 { color: #b26a00; }
        .md .sec-data { border-left-color: #f5a623; background: #fff8ec; }
        .empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 14px; }
        footer { margin-top: 16px; font-size: 12px; color: var(--muted); }
        .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .tabs a { padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); background: var(--card); text-decoration: none; }
        .tabs a.on { background: var(--text); color: #fff; }
        .dayrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 20px; color: var(--text); text-decoration: none; }
        .dayrow .d { font-weight: 700; font-size: 15px; }
        .dayrow .c { font-size: 13px; color: var(--muted); }
        .dayrow .c b { color: var(--text); }
        .more { display: block; text-align: center; padding: 12px; border-radius: 12px; background: var(--card); color: var(--text); font-weight: 600; font-size: 14px; text-decoration: none; }
        .daynav { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
        .daynav a, .daynav span { padding: 8px 14px; border-radius: 10px; background: var(--card); font-size: 13px; font-weight: 600; color: var(--text); text-decoration: none; }
        .daynav span { color: var(--muted); background: transparent; }
        .pcard summary { display: flex; align-items: center; gap: 8px; }
        .pcard .st { font-size: 12px; font-weight: 600; color: #b26a00; background: #fff8ec; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
        .pcard .src { font-size: 12px; color: var(--muted); margin-top: 8px; }
        .pcard .src a { color: var(--muted); }
        .pcard .fav { margin-top: 8px; }
        .fav button { padding: 6px 12px; font-size: 13px; background: var(--bg); color: var(--text); }
        .fav button.on { background: #fff4d6; color: #b26a00; }
</style>

<!-- 제안 카드. 사용: <div th:replace="~{fragments/review :: proposal(${p}, ${backTo}, ${showDay})}"></div>
     backTo: 즐겨찾기를 누른 뒤 돌아올 /review 아래 경로, showDay: 카드 안에 원본 일지 날짜 링크를 보일지 -->
<div th:fragment="proposal(p, backTo, showDay)" class="card pcard">
    <details>
        <summary><span th:text="${p.title}"></span><span class="st" th:text="${p.status}"></span><span th:if="${p.favorite}">⭐</span></summary>
        <div class="md" th:utext="${p.html}"></div>
        <div class="src" th:if="${showDay}">원본 일지: <a th:href="@{/review/day/{d}(d=${p.reviewDay})}" th:text="${p.reviewDay}"></a></div>
        <form class="fav" method="post" th:action="@{/review/proposals/{id}/favorite(id=${p.id})}">
            <input type="hidden" name="favorite" th:value="${!p.favorite}">
            <input type="hidden" name="backTo" th:value="${backTo}">
            <button type="submit" th:classappend="${p.favorite} ? 'on'" th:text="${p.favorite} ? '⭐ 즐겨찾기 해제' : '☆ 즐겨찾기'"></button>
        </form>
    </details>
</div>
</body>
</html>
