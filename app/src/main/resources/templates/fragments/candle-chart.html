<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 캔들 차트 그리기(lightweight-charts). 선물 화면들이 함께 쓴다 — 차트 코드는 여기 한 곳에만 둔다.
     사용: <th:block th:replace="~{fragments/candle-chart :: script(points, lines, baseline, baselineLabel, pollUrl, pollSeconds)}"></th:block>
     - points: ChartPoint 목록(과거 → 최근, 비어 있으면 안 된다) · lines: 가로선(label, price) 목록, 없으면 빈 목록
     - baseline/baselineLabel: 등락률 기준 종가와 그 이름(없으면 null) · pollUrl: 최근 봉 JSON 주소(없으면 null, 갱신 안 함) · pollSeconds: 갱신 주기(초)
     부르는 화면에 id 가 fchart(차트 자리), last(현재가), pct(등락), ohlc(시고저종) 인 요소가 있어야 한다. -->
<th:block th:fragment="script(points, lines, baseline, baselineLabel, pollUrl, pollSeconds)">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script th:inline="javascript">
    const points = /*[[${points}]]*/ [];
    const levels = /*[[${lines}]]*/ [];
    const baseline = /*[[${baseline}]]*/ null;
    const baselineLabel = /*[[${baselineLabel}]]*/ '';
    const pollUrl = /*[[${pollUrl}]]*/ null;
    const pollSeconds = /*[[${pollSeconds}]]*/ 10;
    const chart = LightweightCharts.createChart(document.getElementById('fchart'), {
        layout: { background: { color: '#ffffff' }, textColor: '#191f28' },
        grid: { vertLines: { color: '#eceef1' }, horzLines: { color: '#eceef1' } },
        timeScale: { timeVisible: true, secondsVisible: false },
        rightPriceScale: { borderVisible: false },
    });
    const candles = chart.addCandlestickSeries({
        upColor: '#f04452', downColor: '#3182f6', borderVisible: false,
        wickUpColor: '#f04452', wickDownColor: '#3182f6',
    });
    candles.setData(points);
    const volume = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: '' });
    volume.priceScale().applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
    volume.setData(points.map(p => ({ time: p.time, value: p.volume, color: p.close >= p.open ? '#f0445266' : '#3182f666' })));

    // 가로선(옵션 매물대): 저항(빨강)·지지(파랑)·맥스페인(회색).
    levels.forEach(l => candles.createPriceLine({
        price: l.price,
        title: l.label,
        color: l.label.startsWith('콜') ? '#f04452' : l.label.startsWith('풋') ? '#3182f6' : '#8b95a1',
        lineStyle: 2,
        lineWidth: 1,
    }));

    // 기준 종가(전일·주간 종가)를 가로선으로도 그려 둔다.
    if (baseline !== null) candles.createPriceLine({ price: baseline, title: baselineLabel, color: '#191f28', lineStyle: 1, lineWidth: 1 });

    const lastEl = document.getElementById('last');
    const pctEl = document.getElementById('pct');
    const ohlcEl = document.getElementById('ohlc');
    const fmt = (v) => Number(v).toFixed(2);
    function show(p) {
        lastEl.textContent = fmt(p.close);
        if (baseline !== null) {
            const diff = p.close - baseline;
            pctEl.className = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
            pctEl.textContent = (diff > 0 ? '+' : '') + fmt(diff) + ' (' + (diff > 0 ? '+' : '') + (diff / baseline * 100).toFixed(2) + '%)';
        }
        ohlcEl.textContent = (baseline !== null ? baselineLabel + ' ' + fmt(baseline) + ' · ' : '')
            + '시 ' + fmt(p.open) + ' · 고 ' + fmt(p.high) + ' · 저 ' + fmt(p.low) + ' · 종 ' + fmt(p.close) + ' · 거래량 ' + p.volume;
    }
    const latest = () => show(points[points.length - 1]);
    latest();
    chart.subscribeCrosshairMove(param => {
        const p = param.time === undefined ? null : points.find(x => x.time === param.time);
        if (p) show(p); else latest();
    });
    chart.timeScale().fitContent();

    // pollUrl 이 있으면 pollSeconds 마다 최근 봉을 다시 받아 마지막 봉부터 갱신한다(새 봉이 생기면 추가된다).
    if (pollUrl) {
        setInterval(async () => {
            try {
                const res = await fetch(pollUrl);
                const fresh = await res.json();
                let lastTime = points[points.length - 1].time;
                fresh.filter(p => p.time >= lastTime).forEach(p => {
                    candles.update(p);
                    volume.update({ time: p.time, value: p.volume, color: p.close >= p.open ? '#f0445266' : '#3182f666' });
                    if (p.time === lastTime) points[points.length - 1] = p; else points.push(p);
                    lastTime = p.time;
                });
                latest();
            } catch (e) { /* 다음 주기에 다시 시도 */ }
        }, pollSeconds * 1000);
    }
    new ResizeObserver(() => chart.applyOptions({ width: document.getElementById('fchart').clientWidth }))
        .observe(document.getElementById('fchart'));
</script>
</th:block>
</body>
</html>
