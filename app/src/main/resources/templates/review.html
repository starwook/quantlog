<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>일일 리뷰 · quantlog</title>
    <style th:replace="~{fragments/review :: style}"></style>
</head>
<body>
<main>
    <nav th:replace="~{fragments/nav :: menu('review')}"></nav>

    <h1>일일 리뷰</h1>
    <p class="note">
        Claude 가 하루 체결과 보유 현황을 현재 원칙에 비춰 복기한 기록입니다. 평일 15:31(국내 장 마감 직후)에 자동으로 만들어지고,
        그 시각 전에 직접 실행하면 직전 평일을 복기합니다. 원칙은 자동으로 바뀌지 않고, 바꿀 근거나 더 모아야 할 데이터가 있으면 날짜 안의 "원칙 변경 제안"에 올라옵니다.
    </p>

    <div class="msg done" th:if="${done}" th:text="${done}"></div>
    <div class="msg error" th:if="${error}" th:text="${error}"></div>

    <form class="card run" method="post" th:action="@{/review/run}"
          onsubmit="const b = this.querySelector('button'); b.disabled = true; b.textContent = '리뷰 만드는 중… (최대 1분)';">
        <input type="password" name="token" placeholder="실행 비밀번호" th:if="${tokenRequired}" required autocomplete="off">
        <button type="submit">지금 리뷰 실행</button>
        <span class="note" style="margin: 0;">Claude API 를 한 번 부릅니다(비용 발생).</span>
    </form>

    <div class="tabs">
        <a href="/review" class="on">날짜별</a>
        <a href="/review/favorites">⭐ 즐겨찾기 <span th:text="${favoriteCount}"></span></a>
    </div>

    <div class="empty card" th:if="${#lists.isEmpty(days)}">아직 일지가 없습니다. 위 버튼으로 첫 리뷰를 만들어 보세요.</div>
    <a class="card dayrow" th:each="row : ${days}" th:href="@{/review/day/{d}(d=${row.day})}">
        <span class="d" th:text="${row.label}"></span>
        <span class="c">
            일지 <b th:text="${row.journals}"></b> · 제안 <b th:text="${row.proposals}"></b><span th:if="${row.favorites > 0}"> · ⭐<span th:text="${row.favorites}"></span></span>
        </span>
    </a>
    <a class="more" th:if="${moreLimit != null}" th:href="@{/review(limit=${moreLimit})}">더 보기</a>
</main>
</body>
</html>
